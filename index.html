<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The IFB Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
/* ===== Palette: newsprint, inspired by The Hindu ===== */
:root{--bg:#fbfaf6;--card:#ffffff;--ink:#141414;--mut:#3f3f3f;--line:#d6d2c8;--tint:#f0ede4;--acc:#0e4d8c;--on-acc:#ffffff;--ok:#1f7a3a;--bad:#b3261e;--amb:#a86400}
*{box-sizing:border-box}
html{font-size:15px}
html,body{height:100%;margin:0;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
.hide{display:none!important}

/* ===== Masthead ===== */
header{flex:none;text-align:center;background:var(--card);border-bottom:1px solid var(--line)}
.topstrip{display:flex;justify-content:space-between;max-width:1200px;margin:0 auto;padding:3px 16px;font:600 .72rem system-ui,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line)}
h1.masthead{margin:0;padding:2px 0 0;font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:900;letter-spacing:.01em;font-size:clamp(1.8rem,6.4vh,2.7rem);line-height:1.1;color:var(--ink)}
nav{display:flex;justify-content:center;flex-wrap:wrap;max-width:1200px;margin:0 auto;border-top:1px solid var(--ink);border-bottom:3px double var(--ink)}
nav button{border:0;border-bottom:3px solid transparent;background:none;color:var(--ink);font:700 .78rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:6px 16px;margin-bottom:-1px;cursor:pointer}
nav button:hover{color:var(--acc)}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
nav button i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--ink);color:#fff;font-size:.62rem;margin-right:6px}
nav button.on i{background:var(--acc)}

/* ===== Scrolling tagline ===== */
.ticker{overflow:hidden;background:var(--ink);color:#fff;white-space:nowrap;line-height:1}
.tk{display:inline-flex;align-items:center;animation:tkmove 45s linear infinite;will-change:transform}
.tk span{font:700 .78rem system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;padding:6px 0}
.tk b{color:#9cc4ec;margin:0 22px;font-size:.7rem}
@keyframes tkmove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.tk{animation-duration:120s}}

/* ===== Layout ===== */
main{flex:1;min-height:0;width:100%;max-width:1200px;margin:0 auto;padding:8px 16px;display:flex;flex-direction:column}
main>section{flex:1;min-height:0;display:flex;flex-direction:column}
.btn{font:600 .84rem system-ui,sans-serif;padding:5px 11px;border:1px solid #8a8a8a;background:#fff;color:var(--ink);border-radius:2px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.btn.pri:hover:not(:disabled){color:#fff;filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:default}
.sechead{flex:none;display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--ink);border-bottom:1px solid var(--line);padding:5px 0;margin-bottom:6px;font:700 .85rem Georgia,serif;text-transform:uppercase;letter-spacing:.07em}
.sechead span+span{font:600 .76rem system-ui,sans-serif;color:var(--mut);letter-spacing:.06em}
.kick{font:700 .74rem system-ui,sans-serif;color:var(--acc);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px}
.pager{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;margin-top:4px;border-top:1px solid var(--line)}
.pg{display:flex;gap:4px}
.pg button{width:26px;height:26px;border:1px solid #8a8a8a;background:#fff;color:var(--ink);font:700 .82rem system-ui,sans-serif;cursor:pointer;border-radius:2px;padding:0}
.pg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.res{font:700 .88rem system-ui,sans-serif}
.pos{color:var(--ok)}.neg{color:var(--bad)}

/* ===== 1. News (one story per page) ===== */
.lead{flex:1;min-height:0;display:grid;grid-template-columns:38% 1fr;gap:22px;padding:10px 0}
.nimg{width:100%;height:100%;min-height:120px;object-fit:cover;border:1px solid var(--line);background:var(--tint)}
.sbody{min-height:0;overflow:auto;padding-right:6px}
.lead h2{font-family:Georgia,'Times New Roman',serif;font-size:clamp(1.25rem,4.2vh,1.9rem);line-height:1.2;margin:0 0 8px}
.lead .by{font:600 .76rem system-ui,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.lead p{font-size:clamp(.9rem,2.4vh,1.02rem);line-height:1.6;margin:0 0 10px;color:#111}

/* ===== 2. Rules ===== */
.rgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:0 28px;overflow:auto}
.rule{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-height:0}
.rn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 .76rem system-ui,sans-serif}
.rule h3{margin:0 0 2px;font:700 1.02rem Georgia,'Times New Roman',serif}
.rule p{margin:0;font-size:.92rem;line-height:1.45;color:#111}

/* ===== 3. Quiz ===== */
#dots{flex:none;display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
#dots button{width:27px;height:27px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--ink);font:700 .76rem system-ui,sans-serif;cursor:pointer;padding:0}
#dots button.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
#dots button.c{background:var(--ok);color:#fff;border-color:var(--ok)}
#dots button.w{background:var(--bad);color:#fff;border-color:var(--bad)}
#dots button.u{background:var(--mut);color:#fff;border-color:var(--mut)}
.slide{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border-top:3px solid var(--ink);padding:clamp(8px,1.6vh,16px) 6px;overflow:hidden}
.meta{flex:none;display:flex;flex-wrap:wrap;gap:6px;font:600 .78rem system-ui,sans-serif;color:var(--mut);margin-bottom:6px}
.pill{padding:2px 8px;background:var(--tint);border-radius:2px}
.pill.who{background:var(--acc);color:var(--on-acc)}
.q{flex:none;font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:clamp(1.2rem,4vh,1.9rem);line-height:1.3;margin:0 0 clamp(10px,2vh,18px)}
.opts{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:auto;align-content:start;gap:12px;overflow:auto}
.opt{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;font-size:clamp(.95rem,2.7vh,1.2rem);padding:16px 16px;min-height:72px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:2px;cursor:pointer}
.opt b{width:24px;height:24px;flex:none;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 .76rem system-ui,sans-serif}
.opt:hover:not(:disabled){border-color:var(--acc);background:#f3f7fb}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,#fff)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,#fff)}
.opt.picked{outline:2px solid var(--ink)}
.bar{flex:none;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:clamp(6px,1.4vh,12px)}
.timer{display:flex;align-items:center;gap:10px}
#clock{width:clamp(42px,8vh,60px);height:clamp(42px,8vh,60px);border-radius:50%;border:5px solid var(--line);display:grid;place-items:center;font:700 clamp(1rem,3.4vh,1.6rem) system-ui,sans-serif}
#clock.read{border-color:var(--amb);color:var(--amb)}
#clock.ans{border-color:var(--ok);color:var(--ok)}
#clock.end{border-color:var(--bad);color:var(--bad)}
#phase{font:700 .86rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em}
.lockbox{flex:1;min-height:0;display:grid;place-items:center;text-align:center;border:2px dashed var(--line);background:var(--bg);padding:10px}
.lockic{font-size:clamp(2rem,8vh,3.6rem);line-height:1}
.lockbox p{font:600 clamp(.9rem,2.4vh,1.15rem) system-ui,sans-serif;color:var(--mut);margin:6px 0 12px}
.btn.big{font-size:clamp(.85rem,2.2vh,1.05rem);padding:9px 20px}
.tiewrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;flex:1;min-height:0;overflow:auto}
.tie-team{border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;min-height:0}
.tie-team h3{margin:0 0 6px;font-size:.9rem}
.tie-team .opts{grid-template-columns:1fr;gap:5px}
.tie-team .opt{font-size:.85rem;padding:5px 9px}

/* ===== 4. Results ===== */
#vS{overflow:auto}
#vS:not(.hide){display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start}
#vS .full{grid-column:1/-1}
.grp{background:var(--card);border-top:3px solid var(--ink);padding:8px 0 0}
.grp h2{margin:0 0 6px;font-size:1rem;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:5px}
.grp.win{background:var(--tint);padding:10px 12px;border-top:3px solid var(--acc);font-size:1.05rem}
.grp p{font-size:.85rem;margin:4px 0}
table{width:100%;border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.88rem}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}

/* ===== Edit questions ===== */
#vE{overflow:auto}
.ed{background:var(--card);border:1px solid var(--line);padding:10px;margin-bottom:10px;font-family:system-ui,sans-serif;font-size:.85rem}
.ed input[type=text],.ed textarea{width:100%;font:inherit;padding:6px;margin:3px 0;border:1px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink)}
.ed label{display:flex;gap:8px;align-items:center}

@media(max-width:800px){
 #vS:not(.hide){grid-template-columns:1fr}
 .lead{grid-template-columns:1fr;gap:12px;overflow:auto}
 .nimg{height:150px}
 .sbody{overflow:visible}
 .rgrid{grid-template-columns:1fr;grid-auto-rows:auto}
 nav button{padding:6px 9px}
}
@media(max-width:700px){.opts{grid-template-columns:1fr}.opt{font-size:.9rem;padding:5px 10px}}

/* ===== Softer, smoother finish ===== */
:root{--bg:#f7f5ef;--ink:#262626;--mut:#5b5b5b;--line:#e6e2d7;--tint:#f2efe6;--shadow:0 1px 2px rgba(20,20,20,.05),0 8px 22px rgba(20,20,20,.06)}
*{scrollbar-width:thin;scrollbar-color:#cfc9b8 transparent}
body{-webkit-font-smoothing:antialiased}
header{border-bottom:0;box-shadow:0 2px 14px rgba(0,0,0,.06)}
nav{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
nav button{border-radius:10px 10px 0 0;letter-spacing:.06em;transition:color .2s,background .2s,border-color .2s}
nav button:hover{background:var(--tint)}
nav button i{background:var(--mut);transition:background .2s}
.ticker{background:#141414}
.btn{border-radius:999px;border-color:var(--line);padding:6px 15px;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s,border-color .2s,color .2s,filter .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 10px rgba(14,77,140,.18)}
.btn.pri{border-color:var(--acc)}
.pg button{border-radius:50%;border-color:var(--line);transition:all .2s}
.pg button:hover{border-color:var(--acc);color:var(--acc)}
.pg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sechead{border-top:2px solid var(--acc)}
.nimg{border:0;border-radius:16px;box-shadow:var(--shadow)}
.lead p,.rule p{color:#2c2c2c}
.lead{animation:fadeUp .4s ease both}
.rn{background:var(--acc)}
#dots button{border-width:1px;transition:transform .2s,background .2s,border-color .2s}
#dots button:hover{transform:scale(1.1)}
.slide{border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(12px,2vh,22px) clamp(14px,2vw,26px)}
.pill{border-radius:999px;padding:3px 11px}
.opt{border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
.opt:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 14px rgba(14,77,140,.12)}
.opt b{background:var(--acc)}
.opt.picked{outline:2px solid var(--acc);outline-offset:1px}
#clock{border-width:4px;transition:border-color .3s,color .3s}
.lockbox{border:1.5px dashed #d2ccbb;border-radius:16px;background:var(--tint)}
.tie-team{border-radius:14px}
.grp{border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow)}
.grp.win{border-left:4px solid var(--acc)}
.ed{border-radius:14px}
.ed input[type=text],.ed textarea{border-radius:8px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main>section:not(.hide){animation:fadeUp .35s ease both}
@media(prefers-reduced-motion:reduce){main>section,.lead{animation:none!important}.btn,.opt{transition:none!important}}

/* ===== Pager: black instead of blue, controls on the right (left stays empty) ===== */
.npager{justify-content:flex-end;gap:14px}
.pager .btn.pri{background:#141414;border-color:#141414;color:#fff}
.pager .btn:hover:not(:disabled){border-color:#141414;color:#141414;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.pager .btn.pri:hover:not(:disabled){color:#fff;filter:brightness(1.35)}
.pg button:hover{border-color:#141414;color:#141414}
.pg button.on,.pg button.on:hover{background:#141414;border-color:#141414;color:#fff}

/* ===== Winner crown & MVP ===== */
#vS:not(.hide){padding-top:24px}
#vS .full{margin-bottom:6px}
.grp.champ{position:relative;border:2px solid #d4a017;background:linear-gradient(#fffbea,#fff)}
.grp.champ::before{content:"👑";position:absolute;top:-24px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:2rem;line-height:1;animation:crownIn .8s cubic-bezier(.3,1.6,.5,1) both}
.grp.mvp{border-left-color:#d4a017;background:#fffbea}
@keyframes crownIn{from{opacity:0;transform:translate(-50%,-34px) rotate(-30deg) scale(.4)}to{opacity:1;transform:translateX(-50%) rotate(-8deg)}}

/* ===== Keep the bottom-right corner free (the host "Manage app" button sits there) ===== */
.pager,.npager{justify-content:center;gap:14px}
.navbar{justify-content:center;gap:12px}
.navbar>button:last-child{order:1}
.navbar>span{order:2}

/* ===== Meet the Teams ===== */
#vT{overflow:hidden}
.tstage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:8px 0;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--tc) 14%,transparent),transparent 70%)}
.tbadge{font-size:clamp(2.6rem,10vh,4.6rem);line-height:1}
.tlogo{position:relative;z-index:1;display:block;height:100%;max-height:min(27vh,210px);width:auto;max-width:min(60vw,300px);object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18));transform-origin:50% 100%;animation:dance 1.5s ease-in-out .9s infinite}
.tbadge.hasimg{position:relative;flex:0 1 min(27vh,210px);min-height:48px;width:100%;display:flex;justify-content:center;align-items:flex-end;padding:clamp(8px,2vh,20px) 0 8px;font-size:0;line-height:0}
.tbadge.hasimg::before{content:"";position:absolute;left:50%;top:50%;height:100%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 20%,#fff) 0%,color-mix(in srgb,var(--tc) 8%,transparent) 60%,transparent 72%);z-index:0}
.tbadge.hasimg::after{content:"";position:absolute;left:50%;bottom:-6px;width:clamp(90px,22vh,210px);height:12px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.2),transparent 70%);z-index:0}
@keyframes dance{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-7px) rotate(-6deg)}30%{transform:translateX(0) rotate(0)}45%{transform:translateX(7px) rotate(6deg)}60%{transform:translateX(0) rotate(0)}}
.tname{margin:0;font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:clamp(1.9rem,8vh,3.6rem);line-height:1.1;color:var(--tc)}
.ttag{margin:0;font:600 clamp(.95rem,2.6vh,1.2rem) system-ui,sans-serif;color:var(--mut)}
.tprod{margin:0 0 8px;font:700 .72rem system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.mystery{filter:grayscale(1);opacity:.6;animation:wob 1.2s ease-in-out infinite}
.roster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;max-width:880px;margin-top:6px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--tc);border-radius:18px;box-shadow:var(--shadow);padding:16px 10px}
.pcard h3{margin:4px 0 0;font:700 clamp(1.1rem,3.4vh,1.6rem) Georgia,serif}
.pcard p{margin:0;font:600 .8rem system-ui,sans-serif;color:var(--mut)}
.jersey{width:68px;height:68px;border-radius:16px;display:grid;place-items:center;background:var(--tc);color:#fff;font:900 2rem 'Playfair Display',Georgia,serif;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.pcard.hidden{background:var(--tint);border-top-color:var(--line);box-shadow:none}
.pcard.hidden .jersey{background:#cfc9b8;box-shadow:none}
.pcard.hidden h3{color:var(--mut)}
.pop{animation:popIn .7s cubic-bezier(.3,1.7,.5,1) both}
@keyframes popIn{from{opacity:0;transform:scale(.3) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@media(max-width:700px){.roster{grid-template-columns:1fr;gap:10px}.pcard{flex-direction:row;justify-content:flex-start;gap:12px;text-align:left;padding:10px 14px}.pcard h3{margin:0}}
@media(prefers-reduced-motion:reduce){.pop,.mystery,.tlogo{animation:none!important}}

/* ===== News footer: crisp further detail (max 2 lines) ===== */
.nfoot{flex:none;display:flex;gap:12px;align-items:baseline;background:var(--tint);border-radius:10px;padding:8px 14px;margin-top:4px;font:600 .88rem/1.4 system-ui,sans-serif;color:var(--ink)}
.nfoot b{flex:none;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.nfoot span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===== Edit news ===== */
#vW,#vG{overflow:auto}
#sync{font-weight:800}#sync.ok{color:var(--ok)}#sync.bad{color:var(--bad)}
.ed small{display:block;margin-top:8px;font-weight:700;color:var(--mut)}

.nprev{display:block;max-width:240px;max-height:150px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin:6px 0}
.phrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
/* fit everything on one screen without scrolling */
.tstage>*{flex-shrink:0}.tstage>.tbadge.hasimg{flex-shrink:1}
/* balance: name block tightens gently on shorter screens so the photo keeps a good size */
@media(max-height:780px){.roster{gap:12px;margin-top:2px}.pcard{padding:10px 8px;gap:2px}.jersey{width:52px;height:52px;font-size:1.6rem;border-radius:13px}.pcard h3{font-size:1.2rem;margin:2px 0 0}}
@media(max-height:680px){.pcard{padding:7px 8px}.jersey{width:42px;height:42px;font-size:1.3rem;border-radius:11px}.pcard h3{font-size:1.05rem}.pcard p{font-size:.72rem}}
@media(max-height:560px){.pcard p{display:none}}
</style></head><body>
<header>
<div class="topstrip"><span>Thursday, November 26, 2026</span><span>IFB Quiz Edition</span></div>
<h1 class="masthead">The IFB Times</h1>
<nav><button id="tN" class="on"><i>1</i>News</button><button id="tR"><i>2</i>Rules</button><button id="tT"><i>3</i>Meet the Teams</button><button id="tQ"><i>4</i>Quiz</button><button id="tS"><i>5</i>Results</button><button id="tW">Edit News</button><button id="tG">Edit Teams</button><button id="tE">Edit Questions</button></nav>
<div class="ticker" aria-label="Set the customer free"><div class="tk" id="tk"></div></div>
</header>
<main>
<section id="vN"></section>
<section id="vR" class="hide"></section>
<section id="vT" class="hide"></section>
<section id="vQ" class="hide"><div id="dots"></div><div class="slide" id="slide"></div></section>
<section id="vS" class="hide"></section>
<section id="vW" class="hide"></section>
<section id="vG" class="hide"></section>
<section id="vE" class="hide"></section>
</main>

function applause(){

 const cols=["#e63946","#f4a300","#2a9d8f","#1d70b8","#9b5de5","#f15bb5","#ffd60a"],P=[];
 [0,45].forEach(delay=>[0,1].forEach(side=>{for(let i=0;i<90;i++){

 let f=0;

  if(r<=0){stopTimer();clock.textContent="0";clock.className="end";ph.textContent="Time up!";buzzer();$("start").disabled=false;return}
  clock.className=r<=3000?"read":"ans";clock.textContent=Math.ceil(r/1000)},100);
}
function mark(i,v){const priorTie=tiedGroups().join(",");S.ans[i]=v;if(priorTie!==tiedGroups().join(","))S.tieAns={};save();stopTimer();render()}

function quizFoot(i){const f=S.q[i][3];return f&&S.ans[i]!==undefined?`<div class="nfoot"><b>Further detail</b><span>${esc(f)}</span></div>`:""}
function tieFoot(i,tied){const f=TIE_Q[i][3];return f&&tied.length&&tied.every(g=>S.tieAns[`${g}:${i}`]!==undefined)?`<div class="nfoot"><b>Further detail</b><span>${esc(f)}</span></div>`:""}
function render(){
 const tied=tiedGroups();
 if(cur>=S.q.length&&!tied.length)cur=0;
 $("dots").innerHTML=S.q.map((_,k)=>{const p=pts(k),aa=S.ans[k];return`<button class="${k==cur?"cur ":""}${p==20?"c":aa===undefined?"":aa===-1?"u":"w"}" onclick="go(${k})">${k+1}</button>`}).join("")+
 (tied.length?TIE_Q.map((_,k)=>`<button class="${S.q.length+k==cur?"cur ":""}${tied.every(g=>S.tieAns[`${g}:${k}`]!==undefined)?"c":""}" onclick="go(${S.q.length+k})">B${k+1}</button>`).join(""):"");
 if(cur>=S.q.length){renderTie(cur-S.q.length,tied);return}
 const i=cur,{g,m,t}=info(i),[q,o,c]=S.q[i],a=S.ans[i],done=a!==undefined,locked=!done&&!UL.has(i);
 const p=pts(i),wr=done&&a!==-1&&p===0;
 $("slide").innerHTML=`<div class="meta"><span class="pill">Question ${i+1} / 18</span><span class="pill">${GROUPS[g][0]}</span><span class="pill who">${GROUPS[g][1][m]}</span><span class="pill">${t}</span>${tied.length?`<span class="pill">Tie-breakers unlocked</span>`:""}</div>
 ${locked?lockBox(i):`<h2 class="q">${esc(q)}</h2><div class="opts">${o.map((x,k)=>`<button class="opt ${done&&k==c?"right":""} ${done&&a==k&&k!=c?"wrong":""} ${a==k?"picked":""}" onclick="mark(${i},${k})"><b>${L[k]}</b>${esc(x)}</button>`).join("")}</div>`}
 <div class="bar"><div class="timer"><div id="clock">${TIME}</div><div id="phase">${locked?"Locked":"Ready"}</div>${locked?"":`<button class="btn pri" id="start" onclick="startTimer()">▶ Restart timer</button>`}</div>
 <div>${locked?"":`<button class="btn" onclick="mark(${i},-1)">Unanswered (0)</button>`} ${done?`<button class="btn" onclick="clr(${i})">Clear</button>`:""}</div></div>
 <div class="bar navbar"><button class="btn" onclick="go(${i-1})" ${i==0?"disabled":""}>← Previous</button>
 <span class="res ${p>0?"pos":wr?"neg":""}">${done?(p>0?"Correct +20":wr?"Wrong 0":"Unanswered 0")+" · "+GROUPS[g][1][m]:"Not marked yet"}</span>
 ${i==17&&!tied.length?`<button class="btn pri" onclick="tab('S')">See results →</button>`:`<button class="btn" onclick="go(${i+1})">Next →</button>`}</div><div id="qfoot">${quizFoot(i)}</div>`;
}
function renderTie(i,tied){
 const locked=!UL.has("t"+i);
 $("slide").innerHTML=`<div class="meta"><span class="pill">Buffer question ${i+1} / ${TIE_Q.length} · tie-breaker</span><span class="pill">For tied groups: ${tied.map(g=>GROUPS[g][0]).join(", ")}</span></div>
 ${locked?lockBox("t"+i):`<h2 class="q">${esc(TIE_Q[i][0])}</h2><div class="tiewrap">${tied.map(g=>`<div class="tie-team" id="tie-team-${g}">${tieTeamContent(i,g)}</div>`).join("")}</div>`}
 <div class="bar"><div class="timer"><div id="clock">${TIME}</div><div id="phase">${locked?"Locked":"Ready"}</div>${locked?"":`<button class="btn pri" id="start" onclick="startTimer()">▶ Restart timer</button>`}</div><span class="res">Timer applies to all tied groups; tie-break points are separate.</span></div>
 <div class="bar navbar"><button class="btn" onclick="go(${S.q.length+i-1})">← Previous</button><span></span>${i==TIE_Q.length-1?`<button class="btn pri" onclick="tab('S')">See results →</button>`:`<button class="btn" onclick="go(${S.q.length+i+1})">Next →</button>`}</div><div id="qfoot">${tieFoot(i,tied)}</div>`;
}
function tieTeamContent(i,g){const[q,o,c]=TIE_Q[i],a=S.tieAns[`${g}:${i}`],done=a!==undefined;return`<h3>${GROUPS[g][0]} · ${tiePoints(g)} correct</h3><div class="res" style="margin:0 0 6px;font-size:.8rem">⭐ MVP answers: ${teamMvp(g).map(esc).join(" / ")}</div><div class="opts">${o.map((x,k)=>`<button class="opt ${done&&k==c?"right":""} ${done&&a==k&&k!=c?"wrong":""} ${a==k?"picked":""}" onclick="markTie(${i},${g},${k})"><b>${L[k]}</b>${esc(x)}</button>`).join("")}</div>`}
function go(k){const max=S.q.length+(tiedGroups().length?TIE_Q.length:0);if(k<0||k>=max)return;stopTimer();cur=k;render()}
function clr(i){const priorTie=tiedGroups().join(",");delete S.ans[i];if(priorTie!==tiedGroups().join(","))S.tieAns={};save();render()}
function markTie(i,g,a){S.tieAns[`${g}:${i}`]=a;save();$(`tie-team-${g}`).innerHTML=tieTeamContent(i,g);$("qfoot").innerHTML=tieFoot(i,tiedGroups());const dot=$("dots").children[S.q.length+i];dot.classList.toggle("c",tiedGroups().every(group=>S.tieAns[`${group}:${i}`]!==undefined))}

/* ===================== 4. RESULTS ===================== */
function score(){
 const w=winnerInfo(),wg=winnerGroup(),mv=mvpInfo(),marked=S.q.filter((_,i)=>S.ans[i]!==undefined).length;
 $("vS").innerHTML=
  (w?`<div class="grp full win"><b>${wg!==null?"👑":"🏆"} ${esc(w)}</b></div>`+(mv?`<div class="grp full win mvp"><b>⭐ MVP: ${mv.names.map(esc).join(" &amp; ")}</b> — ${mv.pts} points</div>`:""):`<div class="grp full win">Final result appears once all 18 questions are marked (${marked} of 18 so far).</div>`)+
  GROUPS.map(([gn,ms],g)=>{let gt=0;
  const rows=ms.map((n,m)=>{let t=0;const cells=[0,1].map(k=>{const i=g*6+m*2+k,p=pts(i);if(p!==null)t+=p;return`<td>${p===null?"–":(p>0?"+"+p:p)}</td>`}).join("");gt+=t;return`<tr><td><b>${n}</b>${mv&&mv.set.has(g+":"+m)?" ⭐":""}</td>${cells}<td><b class="${t>0?"pos":t<0?"neg":""}">${t}</b></td></tr>`}).join("");
  return`<div class="grp${wg===g?" champ":""}"><h2><span>${wg===g?"👑 ":""}${gn}</span><span>Total: ${gt}</span></h2><table><tr><th>Member</th><th>Politics / Intl</th><th>Business</th><th>Total</th></tr>${rows}</table></div>`}).join("")
  +(tiedGroups().length?`<div class="grp full"><h2>Tie-breaker</h2><p>Unlocked for ${tiedGroups().map(g=>GROUPS[g][0]).join(", ")} because the completed scorecard is tied for the lead. Each tied team\u2019s MVP answers the ${TIE_Q.length} tie-breaker questions: ${tiedGroups().map(g=>GROUPS[g][0]+" – "+teamMvp(g).join(" / ")).join("; ")}.</p>${tiedGroups().map(g=>`<p>${GROUPS[g][0]}: ${tiePoints(g)} / ${TIE_Q.length} correct</p>`).join("")}<p><b>${tieBreakStatus(tiedGroups())}</b></p></div>`:"")
  +`<div class="full"><button class="btn pri" onclick="dlPdf()">⬇ Download PDF</button> <button class="btn" onclick="tab('Q')">← Back to quiz</button> <button class="btn" onclick="if(confirm('Clear all marks?')){S.ans={};S.tieAns={};UL.clear();save();score()}">Reset all scores</button></div>`;
 if(wg!==null){party();applause()}
}

function dlPdf(){
 const clean=t=>String(t).replace(/[−–]/g,"-").replace(/₹/g,"Rs.").replace(/[^\x20-\x7e]/g,"?").replace(/([\\()])/g,"\\$1");
 let c="";
 const T=(x,y,t,sz=11,b=0)=>{c+=`BT /F${b==2?3:b?2:1} ${sz} Tf ${x} ${y} Td (${clean(t)}) Tj ET\n`};
 const Ln=(x1,y1,x2,y2,w=.7)=>{c+=`${w} w ${x1} ${y1} m ${x2} ${y2} l S\n`};
 const R=(x,y,w,h,g)=>{c+=`${g} g ${x} ${y} ${w} ${h} re f 0 g\n`};
 const fmt=p=>p===null?"-":p>0?"+"+p:String(p);
 const totals=groupTotals(),tied=tiedGroups();
 let y=800;
 T(40,y,"The IFB Times",26,2);T(245,y+2,"Quiz - 26 Nov 2026",13,1);y-=18;
 T(40,y,"Scorecard  |  Generated "+new Date().toLocaleString("en-IN"),9);y-=8;
 Ln(40,y,555,y,1.5);y-=26;
 T(40,y,"Standings",13,1);y-=8;Ln(40,y,555,y);y-=16;
 const order=GROUPS.map((_,g)=>g).sort((a,b)=>totals[b]-totals[a]);
 order.forEach((g,r)=>{let n=0;for(let i=g*6;i<g*6+6;i++)if(S.ans[i]!==undefined)n++;
  T(48,y,(r+1)+".",11,1);T(70,y,GROUPS[g][0],11,1);T(220,y,"Total: "+totals[g],11,1);T(310,y,"("+n+" of 6 questions marked)",9);y-=18});
 const w=winnerInfo();
 if(w){y-=2;T(48,y,"Result: "+w,11,1);y-=18;const mv=mvpInfo();if(mv){T(48,y,"MVP: "+mv.names.join(" & ")+" - "+mv.pts+" points",11,1);y-=18}}
 y-=10;
 GROUPS.forEach(([gn,ms],g)=>{
  R(40,y-5,515,20,.9);T(48,y,gn,12,1);T(470,y,"Total: "+totals[g],12,1);y-=24;
  T(48,y,"Member",9,1);T(230,y,"Politics / Intl Q",9,1);T(340,y,"Business Q",9,1);T(470,y,"Total",9,1);y-=6;Ln(40,y,555,y,.5);y-=14;
  ms.forEach((n,m)=>{let t=0,pp=[0,1].map(k=>{const v=pts(g*6+m*2+k);if(v!==null)t+=v;return v});
   T(48,y,n,11);T(230,y,fmt(pp[0]),11);T(340,y,fmt(pp[1]),11);T(470,y,String(t),11,1);y-=6;Ln(40,y,555,y,.3);y-=14});
  y-=14});
 if(tied.length){
  T(40,y,"Tie-breaker",13,1);y-=8;Ln(40,y,555,y);y-=16;
  tied.forEach(g=>{T(48,y,GROUPS[g][0]+": "+tiePoints(g)+" / "+TIE_Q.length+" correct",11);y-=16});
  T(48,y,tieBreakStatus(tied),11,1);y-=22}
 T(40,40,"Scoring: +20 for a correct answer, 0 for a wrong answer or no answer.",9);
 const o=[];
 o[1]="<</Type/Catalog/Pages 2 0 R>>";
 o[2]="<</Type/Pages/Kids[3 0 R]/Count 1>>";
 o[3]="<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 4 0 R/F2 5 0 R/F3 7 0 R>>>>/Contents 6 0 R>>";
 o[4]="<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>";
 o[5]="<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold>>";
 o[7]="<</Type/Font/Subtype/Type1/BaseFont/Times-Bold>>";
 o[6]=`<</Length ${c.length}>>\nstream\n${c}endstream`;
 let out="%PDF-1.4\n";const off=[];
 for(let i=1;i<=7;i++){off[i]=out.length;out+=`${i} 0 obj\n${o[i]}\nendobj\n`}
 const x=out.length;
 out+="xref\n0 8\n0000000000 65535 f \n"+off.slice(1).map(v=>String(v).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<</Size 8/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"application/pdf"}));a.download="IFB-Times-Scorecard.pdf";a.click();
}

 $("vE").innerHTML=`<p style="font-family:system-ui,sans-serif;font-size:.85rem;margin:0 0 8px">Edit the questions, options and the correct answer, then press Save. Order is fixed: for each member, Politics question then Business question.</p>`+
 S.q.map(([q,o,c,f],i)=>{const{g,m,t}=info(i);return`<div class="ed"><b>Q${i+1} · ${GROUPS[g][0]} · ${GROUPS[g][1][m]} · ${t}</b>
 <textarea rows="2" id="eq${i}">${esc(q)}</textarea>${o.map((x,k)=>`<label><input type="radio" name="c${i}" value="${k}" ${k==c?"checked":""}><input type="text" id="eo${i}_${k}" value="${esc(x)}"></label>`).join("")}

 const nt=TIE_Q.map((_,i)=>[$("bq"+i).value,[0,1,2,3].map(k=>$(`bo${i}_${k}`).value),+document.querySelector(`input[name=bc${i}]:checked`).value,$("bf"+i).value.trim()]);
 TIE_Q.splice(0,TIE_Q.length,...nt);S.tie=nt;save();alert("Questions saved.")}

async function dlSite(){

 try{const r=await fetch(location.href.split("#")[0].split("?")[0],{cache:"no-store"});if(!r.ok)throw 0;src=await r.text()}
 catch(e){alert("Please open the website from its https:// link (for example your GitHub Pages address) and try again. This does not work from a file on your computer.");return}
 const re=/\/\*B1\*\/[\s\S]*?\/\*B2\*\//;
 if(!re.test(src)){alert("Could not find the data block in the page.");return}
 const data={v:Date.now(),q:S.q,tie:TIE_Q,teams:teamsSnap(),news:NEWS.map(({title,source,date,body,img})=>({title,source,date,body,img:img||""}))};
 const json=JSON.stringify(data).replace(/</g,"\\u003c");
 src=src.replace(re,()=>"/*B1*/"+json+"/*B2*/");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([src],{type:"text/html"}));a.download="index.html";a.click();
 alert("Downloaded. Upload this index.html to GitHub (replace the old one) to publish your changes for everyone.")}
const DLBTN=`<div class="ed" style="border-left:4px solid var(--acc)"><b>Publish your changes</b><p style="margin:6px 0">Edits are saved only in this browser until you put them into the website file. When you are done editing everything, click below and upload the downloaded <b>index.html</b> to GitHub.</p><button class="btn pri" onclick="dlSite()">⬇ Download updated index.html</button></div>`;
