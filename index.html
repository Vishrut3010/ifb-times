<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The IFB Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
/* ===== Palette: newsprint, inspired by The Hindu ===== */
:root{--bg:#fbfaf6;--card:#ffffff;--ink:#141414;--mut:#3f3f3f;--line:#d6d2c8;--tint:#f0ede4;--acc:#0e4d8c;--on-acc:#ffffff;--ok:#1f7a3a;--bad:#b3261e;--amb:#a86400}
*{box-sizing:border-box}
html{font-size:15px}
html,body{height:100%;margin:0;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
.hide{display:none!important}

/* ===== Masthead ===== */
header{flex:none;text-align:center;background:var(--card);border-bottom:1px solid var(--line)}
.topstrip{display:flex;justify-content:space-between;max-width:1200px;margin:0 auto;padding:3px 16px;font:600 .72rem system-ui,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line)}
h1.masthead{margin:0;padding:2px 0 0;font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:900;letter-spacing:.01em;font-size:clamp(1.8rem,6.4vh,2.7rem);line-height:1.1;color:var(--ink)}
nav{display:flex;justify-content:center;flex-wrap:wrap;max-width:1200px;margin:0 auto;border-top:1px solid var(--ink);border-bottom:3px double var(--ink)}
nav button{border:0;border-bottom:3px solid transparent;background:none;color:var(--ink);font:700 .78rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:6px 16px;margin-bottom:-1px;cursor:pointer}
nav button:hover{color:var(--acc)}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
nav button i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--ink);color:#fff;font-size:.62rem;margin-right:6px}
nav button.on i{background:var(--acc)}

/* ===== Scrolling tagline ===== */
.ticker{overflow:hidden;background:var(--ink);color:#fff;white-space:nowrap;line-height:1}
.tk{display:inline-flex;align-items:center;animation:tkmove 45s linear infinite;will-change:transform}
.tk span{font:700 .78rem system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;padding:6px 0}
.tk b{color:#9cc4ec;margin:0 22px;font-size:.7rem}
@keyframes tkmove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.tk{animation-duration:120s}}

/* ===== Layout ===== */
main{flex:1;min-height:0;width:100%;max-width:1200px;margin:0 auto;padding:8px 16px;display:flex;flex-direction:column}
main>section{flex:1;min-height:0;display:flex;flex-direction:column}
.btn{font:600 .84rem system-ui,sans-serif;padding:5px 11px;border:1px solid #8a8a8a;background:#fff;color:var(--ink);border-radius:2px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.btn.pri:hover:not(:disabled){color:#fff;filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:default}
.sechead{flex:none;display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--ink);border-bottom:1px solid var(--line);padding:5px 0;margin-bottom:6px;font:700 .85rem Georgia,serif;text-transform:uppercase;letter-spacing:.07em}
.sechead span+span{font:600 .76rem system-ui,sans-serif;color:var(--mut);letter-spacing:.06em}
.kick{font:700 .74rem system-ui,sans-serif;color:var(--acc);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px}
.pager{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;margin-top:4px;border-top:1px solid var(--line)}
.pg{display:flex;gap:4px}
.pg button{width:26px;height:26px;border:1px solid #8a8a8a;background:#fff;color:var(--ink);font:700 .82rem system-ui,sans-serif;cursor:pointer;border-radius:2px;padding:0}
.pg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.res{font:700 .88rem system-ui,sans-serif}
.pos{color:var(--ok)}.neg{color:var(--bad)}

/* ===== 1. News (one story per page) ===== */
.lead{flex:1;min-height:0;display:grid;grid-template-columns:38% 1fr;gap:22px;padding:10px 0}
.nimg{width:100%;height:100%;min-height:120px;object-fit:cover;border:1px solid var(--line);background:var(--tint)}
.sbody{min-height:0;overflow:auto;padding-right:6px}
.lead h2{font-family:Georgia,'Times New Roman',serif;font-size:clamp(1.25rem,4.2vh,1.9rem);line-height:1.2;margin:0 0 8px}
.lead .by{font:600 .76rem system-ui,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.lead p{font-size:clamp(.9rem,2.4vh,1.02rem);line-height:1.6;margin:0 0 10px;color:#111}

/* ===== 2. Rules ===== */
.rgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:0 28px;overflow:auto}
.rule{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-height:0}
.rn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 .76rem system-ui,sans-serif}
.rule h3{margin:0 0 2px;font:700 1.02rem Georgia,'Times New Roman',serif}
.rule p{margin:0;font-size:.92rem;line-height:1.45;color:#111}

/* ===== 3. Quiz ===== */
#dots{flex:none;display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
#dots button{width:27px;height:27px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--ink);font:700 .76rem system-ui,sans-serif;cursor:pointer;padding:0}
#dots button.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
#dots button.c{background:var(--ok);color:#fff;border-color:var(--ok)}
#dots button.w{background:var(--bad);color:#fff;border-color:var(--bad)}
#dots button.u{background:var(--mut);color:#fff;border-color:var(--mut)}
.slide{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border-top:3px solid var(--ink);padding:clamp(8px,1.6vh,16px) 6px;overflow:hidden}
.meta{flex:none;display:flex;flex-wrap:wrap;gap:6px;font:600 .78rem system-ui,sans-serif;color:var(--mut);margin-bottom:6px}
.pill{padding:2px 8px;background:var(--tint);border-radius:2px}
.pill.who{background:var(--acc);color:var(--on-acc)}
.q{flex:none;font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:clamp(1.2rem,4vh,1.9rem);line-height:1.3;margin:0 0 clamp(10px,2vh,18px)}
.opts{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:auto;align-content:start;gap:12px;overflow:auto}
.opt{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;font-size:clamp(.95rem,2.7vh,1.2rem);padding:16px 16px;min-height:72px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:2px;cursor:pointer}
.opt b{width:24px;height:24px;flex:none;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 .76rem system-ui,sans-serif}
.opt:hover:not(:disabled){border-color:var(--acc);background:#f3f7fb}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,#fff)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,#fff)}
.opt.picked{outline:2px solid var(--ink)}
.bar{flex:none;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:clamp(6px,1.4vh,12px)}
.timer{display:flex;align-items:center;gap:10px}
#clock{width:clamp(42px,8vh,60px);height:clamp(42px,8vh,60px);border-radius:50%;border:5px solid var(--line);display:grid;place-items:center;font:700 clamp(1rem,3.4vh,1.6rem) system-ui,sans-serif}
#clock.read{border-color:var(--amb);color:var(--amb)}
#clock.ans{border-color:var(--ok);color:var(--ok)}
#clock.end{border-color:var(--bad);color:var(--bad)}
#phase{font:700 .86rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em}
.lockbox{flex:1;min-height:0;display:grid;place-items:center;text-align:center;border:2px dashed var(--line);background:var(--bg);padding:10px}
.lockic{font-size:clamp(2rem,8vh,3.6rem);line-height:1}
.lockbox p{font:600 clamp(.9rem,2.4vh,1.15rem) system-ui,sans-serif;color:var(--mut);margin:6px 0 12px}
.btn.big{font-size:clamp(.85rem,2.2vh,1.05rem);padding:9px 20px}
.tiewrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;flex:1;min-height:0;overflow:auto}
.tie-team{border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;min-height:0}
.tie-team h3{margin:0 0 6px;font-size:.9rem}
.tie-team .opts{grid-template-columns:1fr;gap:5px}
.tie-team .opt{font-size:.85rem;padding:5px 9px}

/* ===== 4. Results ===== */
#vS{overflow:auto}
#vS:not(.hide){display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start}
#vS .full{grid-column:1/-1}
.grp{background:var(--card);border-top:3px solid var(--ink);padding:8px 0 0}
.grp h2{margin:0 0 6px;font-size:1rem;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:5px}
.grp.win{background:var(--tint);padding:10px 12px;border-top:3px solid var(--acc);font-size:1.05rem}
.grp p{font-size:.85rem;margin:4px 0}
table{width:100%;border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.88rem}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}

/* ===== Edit questions ===== */
#vE{overflow:auto}
.ed{background:var(--card);border:1px solid var(--line);padding:10px;margin-bottom:10px;font-family:system-ui,sans-serif;font-size:.85rem}
.ed input[type=text],.ed textarea{width:100%;font:inherit;padding:6px;margin:3px 0;border:1px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink)}
.ed label{display:flex;gap:8px;align-items:center}

@media(max-width:800px){
 #vS:not(.hide){grid-template-columns:1fr}
 .lead{grid-template-columns:1fr;gap:12px;overflow:auto}
 .nimg{height:150px}
 .sbody{overflow:visible}
 .rgrid{grid-template-columns:1fr;grid-auto-rows:auto}
 nav button{padding:6px 9px}
}
@media(max-width:700px){.opts{grid-template-columns:1fr}.opt{font-size:.9rem;padding:5px 10px}}
</style></head><body>
<header>
<div class="topstrip"><span>Monday, November 23, 2026</span><span>IFB Quiz Edition</span></div>
<h1 class="masthead">The IFB Times</h1>
<nav><button id="tN" class="on"><i>1</i>News</button><button id="tR"><i>2</i>Rules</button><button id="tQ"><i>3</i>Quiz</button><button id="tS"><i>4</i>Results</button><button id="tE">Edit Questions</button></nav>
<div class="ticker" aria-label="Set the customer free"><div class="tk" id="tk"></div></div>
</header>
<main>
<section id="vN"></section>
<section id="vR" class="hide"></section>
<section id="vQ" class="hide"><div id="dots"></div><div class="slide" id="slide"></div></section>
<section id="vS" class="hide"></section>
<section id="vE" class="hide"></section>
</main>
<script>
const $=id=>document.getElementById(id),L="ABCD";
/* scrolling tagline: two identical halves so the loop is seamless */
(()=>{const one=Array(12).fill('<span>Set the customer free</span><b>◆</b>').join('');$("tk").innerHTML=one+one})();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const GROUPS=[["Front Load Titans",["Manish","Manav","Rudra"]],["Dish Dynamos",["Siddharth","Abhiraj","Dhanashree"]],["Chill Champions",["Akshat","Ria","Abheetha"]]];
// Order: for each member -> 1 Politics/International, then 1 Business (6 per group, 18 total)
const DEFAULT_Q=[
["Which leader arrived in India on his maiden bilateral trip abroad as Nepal's Prime Minister?",["KP Sharma Oli","Balen Shah","Pushpa Kamal Dahal","Sher Bahadur Deuba"],1],
["Mahindra Financial is evaluating the acquisition of which type of companies?",["Gold finance companies","Insurance firms","Housing finance companies","Fintech startups"],0],
["Where in Delhi was the inaugural SCO Civilisational Forum held?",["Red Fort","India Gate","Purana Quila","Humayun's Tomb"],2],
["Tata Play is in talks to sell its broadband business to which company?",["Bharti Airtel","Atria Convergence Technologies (ACT)","Jio Fiber","Hathway"],1],
["Under the long-term power trade agreement, how much power may India import from Nepal over 10 years?",["1,200 MW","5,000 MW","15,000 MW","10,000 MW"],3],
["How much is Tata Play seeking for its broadband business?",["₹453 crore","₹800 crore","₹2,204 crore","₹1,500 crore"],3],
["India and Belarus will ramp up industrial and defence ties, focusing on agriculture machinery and which technology?",["Drones","Semiconductors","Shipbuilding","Satellites"],0],
["Oravel (Oyo) reported a net profit of how much in FY26?",["₹245 crore","₹678 crore","₹994 crore","₹9,358 crore"],2],
["The Siang Upper Multipurpose Project, facing local opposition, is located in which state and has what capacity?",["Assam, 11,000 MW","Sikkim, 2,000 MW","Arunachal Pradesh, 11,000 MW","Arunachal Pradesh, 6,000 MW"],2],
["Oyo is eyeing an IPO in which quarter, at what valuation?",["Q4, about $2.3 billion","Q1, about $5 billion","Q2, about $1 billion","Q3, about $2.3 billion"],0],
["Who is the Chief Justice of India that said citizens may criticise decisions but should not target institutions?",["BR Gavai","DY Chandrachud","Surya Kant","Sanjiv Khanna"],2],
["Pernod Ricard's board may meet in India in which month to discuss a potential IPO?",["December","January","March","June"],1],
["Which Pakistani federal minister attended the SCO Civilisational Forum in Delhi?",["Ishaq Dar","Musadik Malik","Khawaja Asif","Ahsan Iqbal"],1],
["CII proposed allowing up to what percentage of foreign investment in state-run banks?",["26%","49%","74%","100%"],1],
["Who called on Nepal PM Balen Shah on Sunday?",["Rajnath Singh","Amit Shah","S Jaishankar","Nirmala Sitharaman"],2],
["FPIs have been net buyers of Indian equities for how many consecutive sessions (as of November)?",["5","8","13","189"],2],
["What does VVP, under which Arunachal border villages saw population rise (per Amit Shah), stand for?",["Vibrant Villages Programme","Village Value Plan","Viksit Village Project","Vital Villages Policy"],0],
["Which soft drink is Coca-Cola bringing back after 26 years?",["Gold Spot","Thums Up","Limca","Maaza"],0]];
const TIE_Q=[
["What valuation range are public market investors estimating for Oravel Stays ahead of its proposed IPO?",["₹20,000–22,000 crore","₹15,000–17,000 crore","₹25,000–27,000 crore","₹30,000–32,000 crore"],0],
["Which US hospitality company did Oravel Stays acquire in December 2024?",["Choice Hotels","G6 Hospitality","Wyndham Hotels","Marriott International"],1],
["What percentage of Mahindra Finance’s total assets under management comes from vehicle loans?",["60%","70%","80%","90%"],2],
["What data centre capacity is Karnataka targeting by 2031?",["500 MW","750 MW","1,000 MW","1,500 MW"],2],
["How much funding is Cognition AI reportedly considering raising at a proposed $75 billion valuation?",["$500 million or more","$1 billion or more","$2 billion or more","$5 billion or more"],2]];
const TIME=10; /* seconds per question: one single countdown */
const UL=new Set(); /* questions unlocked this session */

/* ===================== 1. NEWS (3 pages, one story per page) =====================
   Page 1 = Business, Page 2 = International Affairs, Page 3 = Indian Politics.
   Edit the title, source, date and body of each story below (blank line in body = new paragraph).
   To use a real photo, add  img:"https://..."  to a story. If it fails to load, the illustration is shown. */
const NEWS=[
{cat:"Business",title:"[Business story headline to be added]",source:"IFB Times Desk",date:"23 Nov 2026",
 body:"The business story for this edition will appear here.\n\nReplace this text with the full story. Each blank line starts a new paragraph.",
 ic:"💼",lab:"BUSINESS",c1:"#4a3b1d",c2:"#b8893a"},
{cat:"International Affairs",title:"[International affairs story headline to be added]",source:"IFB Times Desk",date:"23 Nov 2026",
 body:"The international affairs story for this edition will appear here.\n\nReplace this text with the full story. Each blank line starts a new paragraph.",
 ic:"🌍",lab:"INTERNATIONAL AFFAIRS",c1:"#1f3a5f",c2:"#4b7bb0"},
{cat:"Indian Politics",title:"[Indian politics story headline to be added]",source:"IFB Times Desk",date:"23 Nov 2026",
 body:"The Indian politics story for this edition will appear here.\n\nReplace this text with the full story. Each blank line starts a new paragraph.",
 ic:"🏛️",lab:"INDIAN POLITICS",c1:"#5c2a2a",c2:"#a5543f"}
];
let nPage=0;
function art(a){
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a.c1}"/><stop offset="1" stop-color="${a.c2}"/></linearGradient><pattern id="p" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.3" fill="#fff" fill-opacity=".13"/></pattern></defs><rect width="400" height="300" fill="url(#g)"/><rect width="400" height="300" fill="url(#p)"/><text x="200" y="168" font-size="112" text-anchor="middle">${a.ic}</text><rect y="248" width="400" height="52" fill="#000" fill-opacity=".5"/><text x="200" y="282" font-family="Georgia,serif" font-size="17" font-weight="bold" letter-spacing="2" fill="#fff" text-anchor="middle">${a.lab}</text></svg>`;
 return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function newsView(){
 const pages=NEWS.length;nPage=Math.min(Math.max(nPage,0),pages-1);
 const a=NEWS[nPage],last=nPage==pages-1;
 $("vN").innerHTML=`<div class="sechead"><span>Page ${nPage+1} · ${esc(a.cat)}</span><span>Monday, 23 November 2026</span></div>
 <article class="lead"><img class="nimg" src="${esc(a.img||art(a))}" alt="${esc(a.lab)}" onerror="this.onerror=null;this.src=art(NEWS[${nPage}])"><div class="sbody"><div class="kick">${esc(a.cat)}</div><h2>${esc(a.title)}</h2><div class="by">${[a.source,a.date].filter(Boolean).map(esc).join(" · ")}</div>${String(a.body).split(/\n\s*\n/).map(x=>`<p>${esc(x)}</p>`).join("")}</div></article>
 <div class="pager"><button class="btn" onclick="nPage--;newsView()" ${nPage==0?"disabled":""}>← Previous page</button>
 <div class="pg">${Array.from({length:pages},(_,p)=>`<button class="${p==nPage?"on":""}" onclick="nPage=${p};newsView()">${p+1}</button>`).join("")}</div>
 ${last?`<button class="btn pri" onclick="tab('R')">Rules of the quiz →</button>`:`<button class="btn pri" onclick="nPage++;newsView()">Next page →</button>`}</div>`;
}

/* ===================== 2. RULES ===================== */
function rulesView(){
 const R=[
 ["Teams","Three teams of three members each take part in the quiz."],
 ["Questions","There are 18 questions. Every member answers two, one on business and one on politics or international affairs, in a fixed order."],
 ["Timer",`A question stays locked until the quizmaster presses “Unlock & start timer”. Each question then has ${TIME} seconds. A buzzer sounds when time is up.`],
 ["Answering","Only the member whose turn it is may answer. Teammates and other people must not help. The answer given before the buzzer is final."],
 ["Scoring","Correct answer: +20 points. Wrong answer: 0 points. No answer: 0 points. There is no negative marking."],
 ["Winner","The team with the highest total after all questions is the winner."],
 ["Tie-break","If teams are tied for the lead, extra tie-break questions are asked to the tied teams. The team with more correct tie-break answers wins."],
 ["Quizmaster","The quizmaster's decision is final. The scorecard can be downloaded as a PDF from the Results tab."]];
 $("vR").innerHTML=`<div class="sechead"><span>Rules of the Quiz</span><span>Please read before you begin</span></div>
 <div class="rgrid">${R.map(([h,t],i)=>`<div class="rule"><div class="rn">${i+1}</div><div><h3>${esc(h)}</h3><p>${esc(t)}</p></div></div>`).join("")}</div>
 <div class="pager"><button class="btn" onclick="tab('N')">← Back to news</button><span></span><button class="btn pri" onclick="tab('Q')">Start the quiz →</button></div>`;
}

/* ===================== 3. QUIZ ===================== */
const lockBox=k=>`<div class="lockbox"><div><div class="lockic">🔒</div><p>This question is locked</p><button class="btn pri big" onclick="unlock('${k}')">🔓 Unlock &amp; start timer</button></div></div>`;
function unlock(k){UL.add(/^\d+$/.test(k)?+k:k);render();startTimer()}
const KEY="ifbtimes.v2";let S={q:DEFAULT_Q,ans:{},tieAns:{}},cur=0,tm=null,ac=null,tick=null;
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.q&&d.q.length==18)S=d}catch(e){}
S.tieAns=S.tieAns||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const info=i=>({g:Math.floor(i/6),m:Math.floor(i%6/2),t:i%2?"Business Affairs":"International / Indian Politics"});
const pts=(i)=>{const a=S.ans[i];if(a===undefined)return null;if(a===-1)return 0;return a===S.q[i][2]?20:0};
function groupTotals(){return GROUPS.map((_,g)=>{let total=0;for(let i=g*6;i<g*6+6;i++){const p=pts(i);if(p!==null)total+=p}return total})}
function tiedGroups(){if(S.q.some((_,i)=>S.ans[i]===undefined))return[];const totals=groupTotals(),high=Math.max(...totals);return totals.flatMap((n,g)=>n===high?[g]:[]).length>1?totals.flatMap((n,g)=>n===high?[g]:[]):[]}
function tiePoints(g){return TIE_Q.reduce((n,_,i)=>n+(S.tieAns[`${g}:${i}`]===TIE_Q[i][2]?1:0),0)}
function tieBreakStatus(groups){if(groups.some(g=>TIE_Q.some((_,i)=>S.tieAns[`${g}:${i}`]===undefined)))return"Answer all five questions for each tied group to determine the winner.";const high=Math.max(...groups.map(tiePoints)),winners=groups.filter(g=>tiePoints(g)===high);return winners.length===1?`${GROUPS[winners[0]][0]} wins the tie-break.`:"The tie remains after all five questions."}
function winnerInfo(){
 if(S.q.some((_,i)=>S.ans[i]===undefined))return null;
 const totals=groupTotals(),tied=tiedGroups();
 if(tied.length)return tieBreakStatus(tied);
 const g=totals.indexOf(Math.max(...totals));
 return`${GROUPS[g][0]} wins with ${totals[g]} points.`;
}

/* sounds (generated with Web Audio, no files needed) */
function actx(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=="suspended")ac.resume();return ac}
function beep(f,d,type="square",v=.25){const a=actx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
function buzzer(){beep(130,1.1,"sawtooth",.5);beep(135,1.1,"square",.3)}
function stopTimer(){clearInterval(tm);clearInterval(tick);tm=tick=null}
function startTimer(){
 stopTimer();actx();let end=Date.now()+TIME*1000,n=0;
 const clock=$("clock"),ph=$("phase");$("start").disabled=true;
 clock.className="ans";ph.textContent="Time running";clock.textContent=TIME;
 tick=setInterval(()=>{beep(n++%2?900:1200,.05,"square",.15)},500);
 tm=setInterval(()=>{const r=end-Date.now();
  if(r<=0){stopTimer();clock.textContent="0";clock.className="end";ph.textContent="Time up!";buzzer();$("start").disabled=false;return}
  clock.className=r<=3000?"read":"ans";clock.textContent=Math.ceil(r/1000)},100);
}
function mark(i,v){const priorTie=tiedGroups().join(",");S.ans[i]=v;if(priorTie!==tiedGroups().join(","))S.tieAns={};save();stopTimer();render()}

function render(){
 const tied=tiedGroups();
 if(cur>=S.q.length&&!tied.length)cur=0;
 $("dots").innerHTML=S.q.map((_,k)=>{const p=pts(k),aa=S.ans[k];return`<button class="${k==cur?"cur ":""}${p==20?"c":aa===undefined?"":aa===-1?"u":"w"}" onclick="go(${k})">${k+1}</button>`}).join("")+
 (tied.length?TIE_Q.map((_,k)=>`<button class="${S.q.length+k==cur?"cur ":""}${tied.every(g=>S.tieAns[`${g}:${k}`]!==undefined)?"c":""}" onclick="go(${S.q.length+k})">T${k+1}</button>`).join(""):"");
 if(cur>=S.q.length){renderTie(cur-S.q.length,tied);return}
 const i=cur,{g,m,t}=info(i),[q,o,c]=S.q[i],a=S.ans[i],done=a!==undefined,locked=!done&&!UL.has(i);
 const p=pts(i),wr=done&&a!==-1&&p===0;
 $("slide").innerHTML=`<div class="meta"><span class="pill">Question ${i+1} / 18</span><span class="pill">${GROUPS[g][0]}</span><span class="pill who">${GROUPS[g][1][m]}</span><span class="pill">${t}</span>${tied.length?`<span class="pill">Tie-breakers unlocked</span>`:""}</div>
 ${locked?lockBox(i):`<h2 class="q">${esc(q)}</h2><div class="opts">${o.map((x,k)=>`<button class="opt ${done&&k==c?"right":""} ${done&&a==k&&k!=c?"wrong":""} ${a==k?"picked":""}" onclick="mark(${i},${k})"><b>${L[k]}</b>${esc(x)}</button>`).join("")}</div>`}
 <div class="bar"><div class="timer"><div id="clock">${TIME}</div><div id="phase">${locked?"Locked":"Ready"}</div>${locked?"":`<button class="btn pri" id="start" onclick="startTimer()">▶ Restart timer</button>`}</div>
 <div>${locked?"":`<button class="btn" onclick="mark(${i},-1)">Unanswered (0)</button>`} ${done?`<button class="btn" onclick="clr(${i})">Clear</button>`:""}</div></div>
 <div class="bar"><button class="btn" onclick="go(${i-1})" ${i==0?"disabled":""}>← Previous</button>
 <span class="res ${p>0?"pos":wr?"neg":""}">${done?(p>0?"Correct +20":wr?"Wrong 0":"Unanswered 0")+" · "+GROUPS[g][1][m]:"Not marked yet"}</span>
 ${i==17&&!tied.length?`<button class="btn pri" onclick="tab('S')">See results →</button>`:`<button class="btn" onclick="go(${i+1})">Next →</button>`}</div>`;
}
function renderTie(i,tied){
 const locked=!UL.has("t"+i);
 $("slide").innerHTML=`<div class="meta"><span class="pill">Tie-breaker ${i+1} / ${TIE_Q.length}</span><span class="pill">For tied groups: ${tied.map(g=>GROUPS[g][0]).join(", ")}</span></div>
 ${locked?lockBox("t"+i):`<h2 class="q">${esc(TIE_Q[i][0])}</h2><div class="tiewrap">${tied.map(g=>`<div class="tie-team" id="tie-team-${g}">${tieTeamContent(i,g)}</div>`).join("")}</div>`}
 <div class="bar"><div class="timer"><div id="clock">${TIME}</div><div id="phase">${locked?"Locked":"Ready"}</div>${locked?"":`<button class="btn pri" id="start" onclick="startTimer()">▶ Restart timer</button>`}</div><span class="res">Timer applies to all tied groups; tie-break points are separate.</span></div>
 <div class="bar"><button class="btn" onclick="go(${S.q.length+i-1})">← Previous</button><span></span>${i==TIE_Q.length-1?`<button class="btn pri" onclick="tab('S')">See results →</button>`:`<button class="btn" onclick="go(${S.q.length+i+1})">Next →</button>`}</div>`;
}
function tieTeamContent(i,g){const[q,o,c]=TIE_Q[i],a=S.tieAns[`${g}:${i}`],done=a!==undefined;return`<h3>${GROUPS[g][0]} · ${tiePoints(g)} correct</h3><div class="opts">${o.map((x,k)=>`<button class="opt ${done&&k==c?"right":""} ${done&&a==k&&k!=c?"wrong":""} ${a==k?"picked":""}" onclick="markTie(${i},${g},${k})"><b>${L[k]}</b>${esc(x)}</button>`).join("")}</div>`}
function go(k){const max=S.q.length+(tiedGroups().length?TIE_Q.length:0);if(k<0||k>=max)return;stopTimer();cur=k;render()}
function clr(i){const priorTie=tiedGroups().join(",");delete S.ans[i];if(priorTie!==tiedGroups().join(","))S.tieAns={};save();render()}
function markTie(i,g,a){S.tieAns[`${g}:${i}`]=a;save();$(`tie-team-${g}`).innerHTML=tieTeamContent(i,g);const dot=$("dots").children[S.q.length+i];dot.classList.toggle("c",tiedGroups().every(group=>S.tieAns[`${group}:${i}`]!==undefined))}

/* ===================== 4. RESULTS ===================== */
function score(){
 const w=winnerInfo(),marked=S.q.filter((_,i)=>S.ans[i]!==undefined).length;
 $("vS").innerHTML=
  (w?`<div class="grp full win"><b>🏆 ${esc(w)}</b></div>`:`<div class="grp full win">Final result appears once all 18 questions are marked (${marked} of 18 so far).</div>`)+
  GROUPS.map(([gn,ms],g)=>{let gt=0;
  const rows=ms.map((n,m)=>{let t=0;const cells=[0,1].map(k=>{const i=g*6+m*2+k,p=pts(i);if(p!==null)t+=p;return`<td>${p===null?"–":(p>0?"+"+p:p)}</td>`}).join("");gt+=t;return`<tr><td><b>${n}</b></td>${cells}<td><b class="${t>0?"pos":t<0?"neg":""}">${t}</b></td></tr>`}).join("");
  return`<div class="grp"><h2><span>${gn}</span><span>Total: ${gt}</span></h2><table><tr><th>Member</th><th>Politics / Intl</th><th>Business</th><th>Total</th></tr>${rows}</table></div>`}).join("")
  +(tiedGroups().length?`<div class="grp full"><h2>Tie-breaker</h2><p>Unlocked for ${tiedGroups().map(g=>GROUPS[g][0]).join(", ")} because the completed scorecard is tied for the lead.</p>${tiedGroups().map(g=>`<p>${GROUPS[g][0]}: ${tiePoints(g)} / ${TIE_Q.length} correct</p>`).join("")}<p><b>${tieBreakStatus(tiedGroups())}</b></p></div>`:"")
  +`<div class="full"><button class="btn pri" onclick="dlPdf()">⬇ Download PDF</button> <button class="btn" onclick="tab('Q')">← Back to quiz</button> <button class="btn" onclick="if(confirm('Clear all marks?')){S.ans={};S.tieAns={};UL.clear();save();score()}">Reset all scores</button></div>`;
}

function dlPdf(){
 const clean=t=>String(t).replace(/[−–]/g,"-").replace(/₹/g,"Rs.").replace(/[^\x20-\x7e]/g,"?").replace(/([\\()])/g,"\\$1");
 let c="";
 const T=(x,y,t,sz=11,b=0)=>{c+=`BT /F${b==2?3:b?2:1} ${sz} Tf ${x} ${y} Td (${clean(t)}) Tj ET\n`};
 const Ln=(x1,y1,x2,y2,w=.7)=>{c+=`${w} w ${x1} ${y1} m ${x2} ${y2} l S\n`};
 const R=(x,y,w,h,g)=>{c+=`${g} g ${x} ${y} ${w} ${h} re f 0 g\n`};
 const fmt=p=>p===null?"-":p>0?"+"+p:String(p);
 const totals=groupTotals(),tied=tiedGroups();
 let y=800;
 T(40,y,"The IFB Times",26,2);T(245,y+2,"Quiz - 23 Nov 2026",13,1);y-=18;
 T(40,y,"Scorecard  |  Generated "+new Date().toLocaleString("en-IN"),9);y-=8;
 Ln(40,y,555,y,1.5);y-=26;
 T(40,y,"Standings",13,1);y-=8;Ln(40,y,555,y);y-=16;
 const order=GROUPS.map((_,g)=>g).sort((a,b)=>totals[b]-totals[a]);
 order.forEach((g,r)=>{let n=0;for(let i=g*6;i<g*6+6;i++)if(S.ans[i]!==undefined)n++;
  T(48,y,(r+1)+".",11,1);T(70,y,GROUPS[g][0],11,1);T(220,y,"Total: "+totals[g],11,1);T(310,y,"("+n+" of 6 questions marked)",9);y-=18});
 const w=winnerInfo();
 if(w){y-=2;T(48,y,"Result: "+w,11,1);y-=18}
 y-=10;
 GROUPS.forEach(([gn,ms],g)=>{
  R(40,y-5,515,20,.9);T(48,y,gn,12,1);T(470,y,"Total: "+totals[g],12,1);y-=24;
  T(48,y,"Member",9,1);T(230,y,"Politics / Intl Q",9,1);T(340,y,"Business Q",9,1);T(470,y,"Total",9,1);y-=6;Ln(40,y,555,y,.5);y-=14;
  ms.forEach((n,m)=>{let t=0,pp=[0,1].map(k=>{const v=pts(g*6+m*2+k);if(v!==null)t+=v;return v});
   T(48,y,n,11);T(230,y,fmt(pp[0]),11);T(340,y,fmt(pp[1]),11);T(470,y,String(t),11,1);y-=6;Ln(40,y,555,y,.3);y-=14});
  y-=14});
 if(tied.length){
  T(40,y,"Tie-breaker",13,1);y-=8;Ln(40,y,555,y);y-=16;
  tied.forEach(g=>{T(48,y,GROUPS[g][0]+": "+tiePoints(g)+" / "+TIE_Q.length+" correct",11);y-=16});
  T(48,y,tieBreakStatus(tied),11,1);y-=22}
 T(40,40,"Scoring: +20 for a correct answer, 0 for a wrong answer or no answer.",9);
 const o=[];
 o[1]="<</Type/Catalog/Pages 2 0 R>>";
 o[2]="<</Type/Pages/Kids[3 0 R]/Count 1>>";
 o[3]="<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 4 0 R/F2 5 0 R/F3 7 0 R>>>>/Contents 6 0 R>>";
 o[4]="<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>";
 o[5]="<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold>>";
 o[7]="<</Type/Font/Subtype/Type1/BaseFont/Times-Bold>>";
 o[6]=`<</Length ${c.length}>>\nstream\n${c}endstream`;
 let out="%PDF-1.4\n";const off=[];
 for(let i=1;i<=7;i++){off[i]=out.length;out+=`${i} 0 obj\n${o[i]}\nendobj\n`}
 const x=out.length;
 out+="xref\n0 8\n0000000000 65535 f \n"+off.slice(1).map(v=>String(v).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<</Size 8/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"application/pdf"}));a.download="IFB-Times-Scorecard.pdf";a.click();
}

/* ===================== EDIT QUESTIONS ===================== */
function edit(){
 $("vE").innerHTML=`<p style="font-family:system-ui,sans-serif;font-size:.85rem;margin:0 0 8px">Edit the questions, options and the correct answer, then press Save. Order is fixed: for each member, Politics question then Business question.</p>`+
 S.q.map(([q,o,c],i)=>{const{g,m,t}=info(i);return`<div class="ed"><b>Q${i+1} · ${GROUPS[g][0]} · ${GROUPS[g][1][m]} · ${t}</b>
 <textarea rows="2" id="eq${i}">${esc(q)}</textarea>${o.map((x,k)=>`<label><input type="radio" name="c${i}" value="${k}" ${k==c?"checked":""}><input type="text" id="eo${i}_${k}" value="${esc(x)}"></label>`).join("")}</div>`}).join("")+
 `<button class="btn pri" onclick="saveEd()">Save changes</button> <button class="btn" onclick="if(confirm('Restore original questions?')){S.q=DEFAULT_Q;save();edit()}">Restore defaults</button>
 <button class="btn" onclick="exp()">Export JSON</button> <button class="btn" onclick="$('imp').click()">Import JSON</button><input id="imp" type="file" accept=".json" class="hide" onchange="imp(this)">`;
}
function saveEd(){S.q=S.q.map((_,i)=>[$("eq"+i).value,[0,1,2,3].map(k=>$(`eo${i}_${k}`).value),+document.querySelector(`input[name=c${i}]:checked`).value]);save();alert("Questions saved.")}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S.q,null,1)],{type:"application/json"}));a.download="quiz-questions.json";a.click()}
function imp(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.length!=18)throw 0;S.q=d;save();edit()}catch(e){alert("Invalid file: need 18 questions.")}};r.readAsText(f.files[0])}

/* ===================== TABS ===================== */
function tab(t){stopTimer();["N","R","Q","S","E"].forEach(k=>{$("v"+k).classList.toggle("hide",k!=t);$("t"+k).classList.toggle("on",k==t)});
 if(t=="N")newsView();if(t=="R")rulesView();if(t=="Q")render();if(t=="S")score();if(t=="E")edit()}
["N","R","Q","S","E"].forEach(k=>$("t"+k).onclick=()=>tab(k));
document.addEventListener("keydown",e=>{if($("vQ").classList.contains("hide")||/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key=="Enter"){const b=document.querySelector(".lockbox .btn");if(b)b.click()}if(e.key=="ArrowRight")go(cur+1);if(e.key=="ArrowLeft")go(cur-1)});
tab("N");
</script></body></html>
